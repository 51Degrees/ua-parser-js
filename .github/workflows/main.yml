name: 'Publish package'

# Publishes the version that package.json holds. Only a commit changes that
# version, so a run cannot move it.

permissions:
  contents: write

env:
  # The organisation's test key, which carries the properties the tests
  # read. The repository's own is a free key without them.
  USER_KEY_VALID: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
  USER_KEY_INVALID: ${{ secrets.USER_KEY_INVALID }}

on:
  workflow_dispatch:

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's own Node.js, the same one the tests run on.
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: yarn install
      - name: Run build
        run: yarn run build
      - name: Run tests
        run: yarn run test
      - name: Publish to npm
        run: yarn publish --access public --tag latest --non-interactive
        env:
          # The organization's npm token, which the other 51Degrees npm
          # packages publish with.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      # Tagged only once the version is on npm.
      - name: Tag the published version
        run: |
          version=$(node -p "require('./package.json').version")
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "v$version" -m "Version $version"
          git push origin "v$version"

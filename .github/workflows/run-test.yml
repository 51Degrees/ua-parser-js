name: ua-parser-js-run-test

on: [push, pull_request]

permissions:
  contents: read

env:
  # The organisation's test key, which carries the properties the tests
  # read. The repository's own is a free key without them.
  USER_KEY_VALID: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
  USER_KEY_INVALID: ${{ secrets.USER_KEY_INVALID }}

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
      - name: Run the test
        run: |
          yarn
          yarn build
          yarn test
